name: Validate client metadata

# Runs the check from the pull request's own copy of the repository. It
# tells the author what is wrong. The check a pull request is judged by
# is the trusted one in validate-client-metadata-trusted.yml, which runs
# main's copy of the script against the pull request's document.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check oauth/client.json against the client id rules
        run: python3 .github/scripts/check_client_metadata.py oauth/client.json
