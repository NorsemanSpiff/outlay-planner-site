name: Validate client metadata

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check oauth/client.json against the client id rules
        shell: python
        run: |
          import json, sys

          PATH = "oauth/client.json"
          CLIENT_ID = "https://norsemanspiff.github.io/planning-grid-site/oauth/client.json"
          MAX_BYTES = 5 * 1024
          failures = []

          def check(ok, label):
              print(("PASS " if ok else "FAIL ") + label)
              if not ok:
                  failures.append(label)

          raw = open(PATH, "rb").read()
          check(len(raw) <= MAX_BYTES, f"size {len(raw)} bytes is at most {MAX_BYTES}")
          check(not raw.startswith(b"\xef\xbb\xbf"), "no byte order mark")
          check(b"\r" not in raw, "no carriage returns")
          check(raw.endswith(b"}\n"), "ends with a closing brace and one newline")

          def no_duplicates(pairs):
              keys = [k for k, _ in pairs]
              if len(keys) != len(set(keys)):
                  raise ValueError("duplicate key")
              return dict(pairs)

          try:
              doc = json.loads(raw.decode("utf-8"), object_pairs_hook=no_duplicates,
                               parse_constant=lambda c: (_ for _ in ()).throw(ValueError(c)))
              check(isinstance(doc, dict), "top level is a JSON object")
          except Exception as exc:
              check(False, f"strict JSON parse: {exc}")
              doc = {}

          check(doc.get("client_id") == CLIENT_ID, "client_id is string-equal to the document URL")
          name = doc.get("client_name")
          check(isinstance(name, str) and name.strip() != "", "client_name is a non-empty string")
          uris = doc.get("redirect_uris")
          check(isinstance(uris, list) and len(uris) > 0
                and all(isinstance(u, str) and u.startswith("https://") for u in uris),
                "redirect_uris is a non-empty list of https URLs")
          check(doc.get("token_endpoint_auth_method") == "none", "token_endpoint_auth_method is none")
          grants = doc.get("grant_types", ["authorization_code"])
          check(isinstance(grants, list) and "authorization_code" in grants, "grant_types includes authorization_code")
          check(doc.get("response_types", ["code"]) == ["code"], "response_types is [code]")

          forbidden_keys = [k for k in doc if "secret" in k.lower() or k in ("jwks", "jwks_uri")]
          check(not forbidden_keys, f"no secret or key members (found {forbidden_keys})")
          text = raw.decode("utf-8", "replace").upper()
          check("BEGIN " not in text and "PRIVATE KEY" not in text, "no key material in the body")

          if failures:
              print(f"\n{len(failures)} check(s) failed")
              sys.exit(1)
          print("\nall checks passed")
